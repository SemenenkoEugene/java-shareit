openapi: 3.0.3
info:
  title: ShareIt Users API
  version: 1.0.0
paths:
  /users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    get:
      operationId: getUsers
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    delete:
      operationId: deleteUser
      responses:
        '200':
          description: User deleted
    get:
      operationId: getUserById
      responses:
        '200':
          description: User returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
components:
  schemas:
    CreateUserRequest:
      type: object
      x-class-extra-annotation:
        - '@lombok.Builder(toBuilder = true)'
        - '@lombok.extern.jackson.Jacksonized'
      required:
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          pattern: '^[\s\S]*\S[\s\S]*$'
        email:
          type: string
          format: email
          pattern: '.*\S.*'
    UpdateUserRequest:
      type: object
      x-class-extra-annotation:
        - '@lombok.Builder(toBuilder = true)'
        - '@lombok.extern.jackson.Jacksonized'
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          nullable: true
          pattern: '^[\s\S]*\S[\s\S]*$'
        email:
          type: string
          format: email
          nullable: true
          pattern: '.*\S.*'
    UserResponse:
      type: object
      x-class-extra-annotation:
        - '@lombok.Builder(toBuilder = true)'
        - '@lombok.extern.jackson.Jacksonized'
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
