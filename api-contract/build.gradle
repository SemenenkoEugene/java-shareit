def generateAllDto = tasks.register('generateAllDto') {
    dependsOn generateUserDto, generateItemDto, generateBookingDto, generateRequestDto
}

tasks.named('compileJava') {
    dependsOn generateAllDto
}

tasks.matching {
    it.name == 'generateEffectiveLombokConfig' || it.name == 'delombok'
}.configureEach {
    dependsOn generateAllDto
}

tasks.named('checkstyleMain') {
    source = fileTree('src/main/java')
}

tasks.named('pmdMain') {
    source = fileTree('src/main/java')
}
